<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스레드 · 인스타 작업실</title>
<meta name="description" content="네이버 블로그 원문을 Threads·Instagram 포스트로 변환한 작업 게시판">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <span class="dot"></span>
      <span>스레드 · 인스타 작업실</span>
    </a>
    <nav class="nav">
      <a id="blogLink" href="https://blog.naver.com/like_moon" target="_blank" rel="noopener">원본 블로그 ↗</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <section id="listView">
    <div class="hero">
      <h1>블로그 최신글 → <em>Threads 3종 + Instagram 1종</em></h1>
      <p class="sub" id="metaLine">불러오는 중…</p>
    </div>

    <div class="tools">
      <input id="q" type="search" placeholder="제목 · 지역 · 카테고리 검색" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>

    <div class="cards" id="cards"></div>
    <p class="empty" id="empty" hidden>해당하는 글이 없습니다.</p>
  </section>

  <section id="detailView" hidden></section>
</main>

<footer class="foot">
  <div class="wrap">
    <span id="footMeta"></span>
    <span class="sep">·</span>
    <a href="#/">목록으로</a>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./app.js"></script>
</body>
</html>
